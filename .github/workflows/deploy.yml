# Deploys the studio to https://tools.from-avalon.com/janitor-profile-maker/ on every push to main.
#
# The studio is a static site, so "deploy" is a file copy: rsync the browser-
# facing files to the VPS docroot. Nothing is built. The SSH key in the
# DEPLOY_SSH_KEY secret is restricted on the server (rrsync, write-only, one
# directory) — it cannot open a shell or touch anything else on the box.
name: Deploy studio

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-studio
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Install deploy key
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Stage the files the browser loads
        # Same list tools/sync-to-next.mjs ships. Staging into one directory and
        # syncing THAT lets --delete mirror the docroot root too — syncing a list
        # of items only mirrors inside each item, so a removed top-level file
        # would otherwise linger on the server forever.
        run: |
          rm -rf .deploy && mkdir .deploy
          cp -r index.html .htaccess CHANGELOG.md assets css js preview .deploy/
          rm -f .deploy/preview/snapshot.html

      - name: rsync to VPS
        # --delete keeps the server an exact mirror of main: removed files go away.
        run: |
          rsync -az --delete --stats \
            -e "ssh -i ~/.ssh/deploy_key -p 2200 -o IdentitiesOnly=yes" \
            .deploy/ from-avalon@69.62.118.163:/ | tail -n 15

      - name: Verify the site answers
        # A transient connect failure from a runner should cost seconds, not
        # hang for curl's default 135 s and hold the deploy queue. The files
        # are already on the server by this point; this step only confirms.
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            --connect-timeout 10 --max-time 30 \
            --retry 4 --retry-delay 5 --retry-all-errors \
            https://tools.from-avalon.com/janitor-profile-maker/)
          echo "https://tools.from-avalon.com/janitor-profile-maker/ -> $code"
          test "$code" = "200"
