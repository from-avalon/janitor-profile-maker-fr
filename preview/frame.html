  <!-- Simulator-only styling. Lives before the user stylesheet so it never wins
       a specificity tie that it would not win on JanitorAI. -->
  <style id="sim-chrome">
    html, body { margin: 0; }
    body { overflow-x: hidden; }
    /* The snapshot is a static capture: kill navigation so clicks in the
       preview never leave the page. */
    a { cursor: default; }

    /* ---- Canvas overlays (Design mode) ----
       Custom elements rather than divs, and !important throughout, so a
       creator's `div { … }` or `* { … }` rule restyles their profile and not
       the selection box drawn on top of it. Geometry is set inline. */
    sim-ui {
      all: initial;
      display: none;
      position: fixed !important;
      z-index: 2147483646 !important;
      box-sizing: border-box !important;
      pointer-events: none !important;
    }
    /* A dark hairline round the red keeps the outline readable on a profile
       that is itself red. */
    #sim-hover { border: 1px solid #ff3b4e !important; box-shadow: 0 0 0 1px rgba(0,0,0,.35) !important; }
    #sim-sel { border: 1.5px solid #ff3b4e !important; box-shadow: 0 0 0 1px rgba(0,0,0,.45) !important; }
    #sim-sel[data-editing] { border-style: dashed !important; }
    #sim-sel[data-locked] { border-color: #f5a524 !important; }
    #sim-sel-tag, #sim-ghost {
      padding: 1px 6px !important;
      border-radius: 3px !important;
      background: #ff3b4e !important;
      color: #fff !important;
      font: 600 11px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif !important;
      white-space: nowrap !important;
      max-width: 60vw !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
    }
    #sim-sel[data-locked] + #sim-sel-tag { background: #f5a524 !important; color: #1a1202 !important; }
    #sim-ghost { z-index: 2147483647 !important; opacity: .92 !important; box-shadow: 0 6px 18px rgba(0,0,0,.45) !important; }
    #sim-drop[data-kind="line"] { background: #ff3b4e !important; border-radius: 2px !important; box-shadow: 0 0 0 1px rgba(255,255,255,.55) !important; }
    #sim-drop[data-kind="box"] { border: 2px dashed #ff3b4e !important; background: rgba(255,59,78,.06) !important; border-radius: 4px !important; }
    #sim-drop[data-kind="zone"] { border: 2px solid #ff3b4e !important; background: rgba(255,59,78,.26) !important; border-radius: 6px !important; box-shadow: 0 0 0 1px rgba(255,255,255,.5) !important; }

    /* Page sections: the grip that picks up the profile box or the character
       list, and the gutter between them that drags to resize. These two are
       the only overlays that take the pointer. */
    #sim-grip {
      padding: 3px 11px 3px 9px !important;
      border-radius: 999px !important;
      background: #ff3b4e !important;
      color: #fff !important;
      font: 600 11px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif !important;
      white-space: nowrap !important;
      box-shadow: 0 2px 10px rgba(0,0,0,.5), 0 0 0 1px rgba(0,0,0,.35) !important;
      transform: translateX(-50%) !important;
      pointer-events: auto !important;
      -webkit-user-select: none !important; user-select: none !important;
    }
    #sim-grip:hover { background: #ff6475 !important; }
    #sim-split { width: 12px !important; pointer-events: auto !important; background: linear-gradient(90deg, transparent 5px, #ff3b4e 5px 7px, transparent 7px) !important; }
    #sim-split::before {
      content: "" !important;
      position: absolute !important;
      left: 1px !important; top: 50% !important;
      width: 10px !important; height: 38px !important;
      margin-top: -19px !important;
      box-sizing: border-box !important;
      border: 1.5px solid #ff3b4e !important;
      border-radius: 5px !important;
      background: #fff !important;
      box-shadow: 0 1px 6px rgba(0,0,0,.45) !important;
    }
    sim-handle {
      all: initial;
      position: absolute !important;
      width: 9px !important; height: 9px !important;
      box-sizing: border-box !important;
      background: #fff !important;
      border: 1.5px solid #ff3b4e !important;
      pointer-events: auto !important;
    }
    sim-handle[data-handle="e"]  { right: -5px !important; top: calc(50% - 4.5px) !important; }
    sim-handle[data-handle="s"]  { bottom: -5px !important; left: calc(50% - 4.5px) !important; }
    sim-handle[data-handle="se"] { right: -5px !important; bottom: -5px !important; }
    #sim-sel[data-no-resize] sim-handle { display: none !important; }

    /* Design mode: the page is something you select, not something you use. */
    html[data-sim-mode="design"], html[data-sim-mode="design"] * { cursor: default !important; }
    html[data-sim-mode="design"] body { -webkit-user-select: none; user-select: none; }
    html[data-sim-mode="design"] sim-handle[data-handle="e"]  { cursor: ew-resize !important; }
    html[data-sim-mode="design"] sim-handle[data-handle="s"]  { cursor: ns-resize !important; }
    html[data-sim-mode="design"] sim-handle[data-handle="se"] { cursor: nwse-resize !important; }
    html[data-sim-mode="design"] #sim-grip { cursor: grab !important; }
    html[data-sim-mode="design"][data-sim-dragging] #sim-grip { cursor: grabbing !important; }
    html[data-sim-mode="design"] #sim-split { cursor: col-resize !important; }
    html[data-sim-mode="design"][data-sim-dragging], html[data-sim-mode="design"][data-sim-dragging] * { cursor: grabbing !important; }
    html[data-sim-mode="design"] [data-sim-editing],
    html[data-sim-mode="design"] [data-sim-editing] * { cursor: text !important; -webkit-user-select: text; user-select: text; }
    [data-sim-editing] { outline: none; }
    /* An empty box or column has nothing to show for itself, which makes it
       impossible to aim a drop at. Design mode sketches its outline; Preview
       mode and the copied code never have it. An outline, so no layout moves. */
    html[data-sim-mode="design"] .pp-uc-about-me [data-jx]:empty:not(img):not(hr):not(br):not(.jx-shape) {
      outline: 1px dashed rgba(255, 59, 78, .6);
      outline-offset: -1px;
    }

    /* Double-click-to-edit values (username, followers, member-since) */
    .sim-edit-value { border-radius: 3px; outline-offset: 2px; }
    .sim-edit-value.sim-editing {
      box-shadow: 0 0 0 1px #ff3b4e; background: rgba(255, 59, 78, .14);
      outline: none; cursor: text !important; -webkit-user-select: text; user-select: text;
    }
  </style>

  <!-- Preview-content overrides (background image, badge visibility, owner vs
       visitor view). A stylesheet rather than inline styles, so the creator's
       CSS can still override any of it exactly as it would on JanitorAI. -->
  <style id="sim-data"></style>

  <!-- Page styles stored inside an imported MHTML profile. This stays before
       the editor stylesheet so new CSS still wins exactly as expected. -->
  <style id="jai-imported-css"></style>

  <!-- Everything the creator writes lands here, last in <head>, which is where
       JanitorAI puts it relative to the app's own emotion styles. -->
  <style id="jai-user-css"></style>

  <!-- Declarations the properties panel is in the middle of changing. They are
       already in the document; this just shows them a beat before the next
       full pass does, and is emptied when that pass arrives. -->
  <style id="sim-live"></style>
</head>
<body data-ucs="1" style="background-color:var(--colour-grey-550)">
  <sim-ui id="sim-hover"></sim-ui>
  <sim-ui id="sim-sel"><sim-handle data-handle="e"></sim-handle><sim-handle data-handle="s"></sim-handle><sim-handle data-handle="se"></sim-handle></sim-ui>
  <sim-ui id="sim-sel-tag"></sim-ui>
  <sim-ui id="sim-drop"></sim-ui>
  <sim-ui id="sim-grip"></sim-ui>
  <sim-ui id="sim-split"></sim-ui>
  <sim-ui id="sim-ghost"></sim-ui>
  <script src="snapshot.js"></script>
  <script src="fragments.js"></script>
  <script src="frame.js"></script>
</body>
</html>
